name: Docs checks

# Required status check on main (ADR-0013): Jira key in the PR title (ADR-0005), secret scan,
# and Markdown links. Actions are pinned to commit SHAs; the gitleaks binary to a checksum.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Jira key in the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^STORE-[0-9]+: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::The PR title must start with the Jira key, e.g. 'STORE-12: Inventory HLD' (ADR-0005)"
            exit 1
          fi

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Markdown links and anchors
        run: python3 scripts/check-links.py
